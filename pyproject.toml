[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulpo-sextant"
version = "0.1.0"
description = "Standalone, standard-library-only validation and replay of bounded workload-observation documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["sextant"]
